timeout = 300

[[step]]
checkpoint = "typed-2"
golden = false
[[step.assert]]
kind = "ram"
sym = "PSXCEL_JOURNEY"
offset = 32
value = 50
note = "2"

[[step]]
sync = "poll"
press = ["left"]
hold = 1
wait = 1

[[step]]
